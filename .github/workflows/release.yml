# 三平台安装包：打 tag 时构建并发布 GitHub Release；workflow_dispatch 只构建 artifact。
#
# 构建顺序固定：electron-vite 先出 desktop/out，再交给 electron-builder 打 dmg / NSIS / AppImage / deb。
# prompts 与 skills 不是 bundle 的一部分，作为 extraResources 进 resources/；prelude.ts 用
# process.resourcesPath 找它们。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (x64 + arm64)
            args: --mac --x64 --arm64
            artifact: talemate-macos
          - os: windows-latest
            name: Windows (x64)
            args: --win --x64
            artifact: talemate-windows
          - os: ubuntu-latest
            name: Linux (x64)
            args: --linux --x64
            artifact: talemate-linux

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" node -e '
            const fs = require("fs");
            const file = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '

      - run: bun install --frozen-lockfile
      - run: bun run desktop:build

      - name: Package
        run: bun run desktop:package -- ${{ matrix.args }}
        env:
          # 没有签名证书时不要尝试自动发现 identity；DMG 仍然可以生成。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: talemate-*
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
